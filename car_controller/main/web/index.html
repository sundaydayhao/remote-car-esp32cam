<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32CAM Wi-Fi Smart Car</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f0;
      --panel: #ffffff;
      --ink: #202124;
      --muted: #68706a;
      --line: #d9ded6;
      --accent: #007c89;
      --accent-dark: #005d67;
      --warn: #c7462b;
      --ok: #2f7d32;
      --shadow: 0 8px 24px rgba(22, 30, 24, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      align-items: stretch;
    }

    .viewport,
    .controls {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .viewport {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      min-height: 56px;
      padding: 12px 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.2;
    }

    .pill {
      min-height: 28px;
      padding: 6px 9px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fafbf8;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
    }

    .dot.warn {
      background: var(--warn);
    }

    .video-wrap {
      position: relative;
      flex: 1;
      min-height: 360px;
      background: #111;
      display: grid;
      place-items: center;
    }

    .video {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 360px;
      object-fit: contain;
      background: #111;
    }

    .controls {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section {
      display: grid;
      gap: 10px;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, 72px);
      gap: 8px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f9faf7;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    button:active,
    button.active {
      transform: translateY(1px);
      border-color: var(--accent);
      background: #e6f3f4;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .cmd {
      display: grid;
      place-items: center;
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1;
      font-weight: 800;
    }

    .cmd.stop {
      background: var(--warn);
      border-color: var(--warn);
      color: #fff;
      font-size: 28px;
    }

    .cmd.primary {
      background: var(--accent);
      border-color: var(--accent-dark);
      color: #fff;
    }

    .spin-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .spin-row button {
      min-height: 52px;
      font-size: 26px;
      font-weight: 750;
    }

    .speed-row {
      display: grid;
      grid-template-columns: 1fr 54px;
      gap: 10px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .speed-value {
      padding: 8px 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      font-weight: 700;
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .quick button {
      min-height: 42px;
      font-weight: 700;
    }

    .voice-button {
      min-height: 58px;
      width: 100%;
      border-color: var(--accent);
      background: #eef8f7;
      color: var(--accent-dark);
      font-size: 18px;
      font-weight: 800;
      touch-action: none;
    }

    .voice-button.listening {
      background: var(--accent);
      border-color: var(--accent-dark);
      color: #fff;
    }

    .intercom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .intercom-button {
      min-height: 52px;
      font-size: 16px;
      font-weight: 800;
    }

    .intercom-button.live,
    .intercom-button.talking {
      background: var(--accent);
      border-color: var(--accent-dark);
      color: #fff;
    }

    .voice-state,
    .intercom-state {
      min-height: 34px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fafbf8;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .telemetry {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 13px;
    }

    .metric {
      min-height: 48px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fafbf8;
      display: grid;
      align-content: center;
      gap: 2px;
      min-width: 0;
    }

    .metric span {
      color: var(--muted);
      white-space: nowrap;
    }

    .metric strong {
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .video-wrap,
      .video {
        min-height: 260px;
      }

      .controls {
        min-height: auto;
      }

      .dpad {
        grid-template-rows: repeat(3, 64px);
      }
    }

    @media (max-width: 430px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .status-row {
        justify-content: flex-start;
      }

      .controls {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="viewport">
      <div class="topbar">
        <h1>ESP32CAM Wi-Fi 智能小车</h1>
        <div class="status-row">
          <span class="pill"><i id="wifiDot" class="dot"></i><span id="wifiState">Wi-Fi</span></span>
          <span class="pill"><i id="cameraDot" class="dot"></i><span id="cameraState">Camera</span></span>
          <span class="pill"><i id="audioDot" class="dot warn"></i><span id="audioState">Audio</span></span>
          <span class="pill"><i id="blockDot" class="dot"></i><span id="blockState">Clear</span></span>
          <span class="pill"><i id="linkDot" class="dot"></i><span id="linkState">Link</span></span>
        </div>
      </div>
      <div class="video-wrap">
        <img class="video" src="/stream" alt="camera stream">
      </div>
    </section>

    <aside class="controls">
      <div class="section">
        <div class="label">方向</div>
        <div class="dpad">
          <div></div>
          <button class="cmd primary" data-cmd="forward" title="Forward">▲</button>
          <div></div>
          <button class="cmd" data-cmd="left" title="Left">◀</button>
          <button class="cmd stop" data-cmd="stop" title="Stop">■</button>
          <button class="cmd" data-cmd="right" title="Right">▶</button>
          <div></div>
          <button class="cmd" data-cmd="backward" title="Backward">▼</button>
          <div></div>
        </div>
      </div>

      <div class="section">
        <div class="label">原地旋转</div>
        <div class="spin-row">
          <button data-cmd="spin_left" title="Spin left">↺</button>
          <button data-cmd="spin_right" title="Spin right">↻</button>
        </div>
      </div>

      <div class="section">
        <div class="label">速度</div>
        <div class="speed-row">
          <input id="speed" type="range" min="0" max="100" value="60">
          <div id="speedValue" class="speed-value">60%</div>
        </div>
        <div class="quick">
          <button data-speed="35">35%</button>
          <button data-speed="60">60%</button>
          <button data-speed="85">85%</button>
        </div>
      </div>

      <div class="section">
        <div class="label">语音</div>
        <button id="voiceButton" class="voice-button" type="button">按住说话</button>
        <div id="voiceState" class="voice-state">就绪</div>
      </div>

      <div class="section">
        <div class="label">对讲</div>
        <div class="intercom-grid">
          <button id="listenButton" class="intercom-button" type="button">连接收听</button>
          <button id="talkButton" class="intercom-button" type="button">开始讲话</button>
        </div>
        <div id="intercomState" class="intercom-state">未连接</div>
      </div>

      <div class="section">
        <div class="label">状态</div>
        <div class="telemetry">
          <div class="metric"><span>命令</span><strong id="cmdState">stop</strong></div>
          <div class="metric"><span>距离</span><strong id="distanceState">--</strong></div>
          <div class="metric"><span>左轮</span><strong id="leftState">0%</strong></div>
          <div class="metric"><span>右轮</span><strong id="rightState">0%</strong></div>
          <div class="metric"><span>控制端</span><strong id="clientState">--</strong></div>
          <div class="metric"><span>心跳</span><strong id="heartbeatState">--</strong></div>
          <div class="metric"><span>在线设备</span><strong id="stationState">--</strong></div>
          <div class="metric"><span>运行时间</span><strong id="uptimeState">--</strong></div>
        </div>
      </div>
    </aside>
  </main>

  <script>
    const speed = document.querySelector("#speed");
    const speedValue = document.querySelector("#speedValue");
    const commandButtons = [...document.querySelectorAll("[data-cmd]")];
    const speedButtons = [...document.querySelectorAll("[data-speed]")];
    const voiceButton = document.querySelector("#voiceButton");
    const voiceState = document.querySelector("#voiceState");
    const listenButton = document.querySelector("#listenButton");
    const talkButton = document.querySelector("#talkButton");
    const intercomState = document.querySelector("#intercomState");
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const clientId = getClientId();
    const intercomSampleRate = 16000;
    const keyMap = new Map([
      ["ArrowUp", "forward"],
      ["w", "forward"],
      ["W", "forward"],
      ["ArrowDown", "backward"],
      ["s", "backward"],
      ["S", "backward"],
      ["ArrowLeft", "left"],
      ["a", "left"],
      ["A", "left"],
      ["ArrowRight", "right"],
      ["d", "right"],
      ["D", "right"],
      ["q", "spin_left"],
      ["Q", "spin_left"],
      ["e", "spin_right"],
      ["E", "spin_right"],
      [" ", "stop"]
    ]);

    let activeCmd = "stop";
    let holdTimer = 0;
    let activeButton = null;
    let recognition = null;
    let voiceListening = false;
    let voiceInterim = "";
    let voiceFinalSent = false;
    let voicePointerId = null;
    let audioContext = null;
    let audioSocket = null;
    let audioConnectPromise = null;
    let commandSeq = 0;
    let playbackTime = 0;
    let talkEnabled = false;
    let micStream = null;
    let micSource = null;
    let micProcessor = null;

    function getClientId() {
      const key = "esp32cam_car_client_id";
      const existing = localStorage.getItem(key);
      if (existing) return existing;

      const random = Math.random().toString(36).slice(2, 10);
      const id = `web-${Date.now().toString(36)}-${random}`;
      localStorage.setItem(key, id);
      return id;
    }

    function nextSeq() {
      commandSeq = (commandSeq + 1) >>> 0;
      return commandSeq;
    }

    function setLinkState(text, ok = true) {
      const linkDot = document.querySelector("#linkDot");
      const linkState = document.querySelector("#linkState");
      linkDot.classList.toggle("warn", !ok);
      linkState.textContent = text;
    }

    function setSpeedValue(value) {
      speed.value = String(value);
      speedValue.textContent = `${value}%`;
    }

    async function sendControl(cmd) {
      activeCmd = cmd;
      const value = speed.value;
      const seq = nextSeq();
      try {
        const response = await fetch(`/control?cmd=${encodeURIComponent(cmd)}&speed=${encodeURIComponent(value)}&seq=${seq}&source=web&client=${encodeURIComponent(clientId)}`, {
          cache: "no-store"
        });
        const data = await response.json();
        renderStatus(data);
        setLinkState("Link", true);
      } catch (error) {
        document.querySelector("#cmdState").textContent = "offline";
        setLinkState("Offline", false);
      }
    }

    function normalizeTranscript(text) {
      return (text || "").replace(/\s+/g, " ").trim();
    }

    function setVoiceState(text, listening = false) {
      voiceState.textContent = text;
      voiceButton.classList.toggle("listening", listening);
      voiceButton.textContent = listening ? "正在听" : "按住说话";
    }

    async function sendVoiceText(text) {
      const spoken = normalizeTranscript(text);
      if (!spoken) return;

      try {
        const response = await fetch(`/voice?text=${encodeURIComponent(spoken)}&speed=${encodeURIComponent(speed.value)}&seq=${nextSeq()}&client=${encodeURIComponent(clientId)}`, {
          cache: "no-store"
        });
        const data = await response.json();
        renderStatus(data);
        if (data.recognized) {
          setVoiceState(`${spoken} -> ${data.ok ? data.cmd : "blocked"}`, voiceListening);
        } else {
          setVoiceState(`未识别：${spoken}`, voiceListening);
        }
      } catch (error) {
        setVoiceState("offline", voiceListening);
        setLinkState("Offline", false);
      }
    }

    function getRecognition() {
      if (recognition || !SpeechRecognition) return recognition;

      recognition = new SpeechRecognition();
      recognition.lang = "zh-CN";
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => setVoiceState("正在听", true);

      recognition.onresult = (event) => {
        let interim = "";
        let finalText = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0]?.transcript || "";
          if (event.results[i].isFinal) {
            finalText += transcript;
          } else {
            interim += transcript;
          }
        }

        const normalizedInterim = normalizeTranscript(interim);
        if (normalizedInterim) {
          voiceInterim = normalizedInterim;
          setVoiceState(normalizedInterim, true);
        }

        const normalizedFinal = normalizeTranscript(finalText);
        if (normalizedFinal) {
          voiceFinalSent = true;
          sendVoiceText(normalizedFinal);
        }
      };

      recognition.onerror = (event) => {
        voiceListening = false;
        if (event.error === "not-allowed") {
          setVoiceState("麦克风权限被拒绝");
        } else if (event.error === "no-speech") {
          setVoiceState("没有听到语音");
        } else {
          setVoiceState("语音不可用");
        }
      };

      recognition.onend = () => {
        if (voiceListening) {
          try {
            recognition.start();
          } catch (error) {
            setVoiceState("松开后重试");
          }
          return;
        }

        if (!voiceFinalSent && voiceInterim) {
          voiceFinalSent = true;
          sendVoiceText(voiceInterim);
        } else if (!voiceFinalSent) {
          setVoiceState("就绪");
        }
      };

      return recognition;
    }

    function startVoice(event) {
      event.preventDefault();
      stopHold(true);

      if (!SpeechRecognition) {
        setVoiceState("浏览器不支持");
        return;
      }

      voiceListening = true;
      voiceInterim = "";
      voiceFinalSent = false;
      voicePointerId = event.pointerId;

      try {
        if (voicePointerId !== null) voiceButton.setPointerCapture(voicePointerId);
        getRecognition().start();
        setVoiceState("正在听", true);
      } catch (error) {
        voiceListening = false;
        setVoiceState("松开后重试");
      }
    }

    function stopVoice(event) {
      if (event) event.preventDefault();
      if (!voiceListening) return;

      voiceListening = false;
      setVoiceState("识别中", true);

      if (voicePointerId !== null && voiceButton.hasPointerCapture(voicePointerId)) {
        voiceButton.releasePointerCapture(voicePointerId);
      }
      voicePointerId = null;

      if (recognition) {
        try {
          recognition.stop();
        } catch (error) {
          setVoiceState("就绪");
        }
      }
    }

    function setIntercomState(text, connected = false) {
      intercomState.textContent = text;
      listenButton.classList.toggle("live", connected);
      listenButton.textContent = connected ? "停止收听" : "连接收听";
      talkButton.classList.toggle("talking", talkEnabled);
      talkButton.textContent = talkEnabled ? "停止讲话" : "开始讲话";
    }

    async function ensureAudioContext() {
      if (!audioContext) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) throw new Error("audio-context");
        audioContext = new AudioContext();
      }
      if (audioContext.state !== "running") {
        await audioContext.resume();
      }
      return audioContext;
    }

    function audioWebSocketUrl() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      return `${protocol}//${location.host}/audio`;
    }

    function playIncomingAudio(arrayBuffer) {
      if (!audioContext || !arrayBuffer || arrayBuffer.byteLength < 2) return;

      const pcm = new Int16Array(arrayBuffer);
      const buffer = audioContext.createBuffer(1, pcm.length, intercomSampleRate);
      const channel = buffer.getChannelData(0);
      for (let i = 0; i < pcm.length; i++) {
        channel[i] = Math.max(-1, Math.min(1, pcm[i] / 32768));
      }

      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);

      const now = audioContext.currentTime;
      if (playbackTime < now) playbackTime = now + 0.03;
      if (playbackTime - now > 0.8) playbackTime = now + 0.03;
      source.start(playbackTime);
      playbackTime += buffer.duration;
    }

    async function connectIntercom() {
      if (audioSocket?.readyState === WebSocket.OPEN) return audioSocket;
      if (audioConnectPromise) return audioConnectPromise;

      await ensureAudioContext();
      setIntercomState("连接中");

      audioConnectPromise = new Promise((resolve, reject) => {
        const socket = new WebSocket(audioWebSocketUrl());
        audioSocket = socket;
        socket.binaryType = "arraybuffer";

        socket.onopen = () => {
          audioConnectPromise = null;
          playbackTime = audioContext.currentTime + 0.03;
          setIntercomState("收听中", true);
          resolve(socket);
        };

        socket.onmessage = (event) => {
          if (event.data instanceof ArrayBuffer) {
            playIncomingAudio(event.data);
          }
        };

        socket.onclose = () => {
          audioConnectPromise = null;
          audioSocket = null;
          stopTalk();
          setIntercomState("未连接");
        };

        socket.onerror = () => {
          audioConnectPromise = null;
          setIntercomState("连接失败");
          reject(new Error("websocket"));
        };
      });

      return audioConnectPromise;
    }

    function disconnectIntercom() {
      stopTalk();
      if (audioSocket) {
        const socket = audioSocket;
        audioSocket = null;
        socket.close();
      }
      audioConnectPromise = null;
      setIntercomState("未连接");
    }

    function resampleAudio(input, inputRate, outputRate) {
      if (Math.abs(inputRate - outputRate) < 1) return input.slice(0);

      const ratio = inputRate / outputRate;
      const outputLength = Math.max(1, Math.floor(input.length / ratio));
      const output = new Float32Array(outputLength);
      for (let i = 0; i < outputLength; i++) {
        const index = i * ratio;
        const low = Math.floor(index);
        const high = Math.min(input.length - 1, low + 1);
        const weight = index - low;
        output[i] = input[low] * (1 - weight) + input[high] * weight;
      }
      return output;
    }

    function encodePcm16(samples) {
      const buffer = new ArrayBuffer(samples.length * 2);
      const view = new DataView(buffer);
      for (let i = 0; i < samples.length; i++) {
        const sample = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(i * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
      }
      return buffer;
    }

    function handleMicAudio(event) {
      const output = event.outputBuffer.getChannelData(0);
      output.fill(0);

      if (!talkEnabled || audioSocket?.readyState !== WebSocket.OPEN) return;
      if (audioSocket.bufferedAmount > 65536) return;

      const input = event.inputBuffer.getChannelData(0);
      const resampled = resampleAudio(input, audioContext.sampleRate, intercomSampleRate);
      audioSocket.send(encodePcm16(resampled));
    }

    async function startTalk() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setIntercomState("麦克风不可用", audioSocket?.readyState === WebSocket.OPEN);
        return;
      }

      try {
        await connectIntercom();
        await ensureAudioContext();

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        micSource = audioContext.createMediaStreamSource(micStream);
        micProcessor = audioContext.createScriptProcessor(2048, 1, 1);
        micProcessor.onaudioprocess = handleMicAudio;
        talkEnabled = true;
        micSource.connect(micProcessor);
        micProcessor.connect(audioContext.destination);
        setIntercomState("讲话中", true);
      } catch (error) {
        stopTalk();
        setIntercomState("麦克风权限失败", audioSocket?.readyState === WebSocket.OPEN);
      }
    }

    function stopTalk() {
      talkEnabled = false;

      if (micProcessor) {
        micProcessor.disconnect();
        micProcessor.onaudioprocess = null;
        micProcessor = null;
      }
      if (micSource) {
        micSource.disconnect();
        micSource = null;
      }
      if (micStream) {
        micStream.getTracks().forEach((track) => track.stop());
        micStream = null;
      }

      setIntercomState(audioSocket?.readyState === WebSocket.OPEN ? "收听中" : "未连接",
                       audioSocket?.readyState === WebSocket.OPEN);
    }

    function startHold(cmd, button) {
      stopHold(false);
      activeButton = button || null;
      if (activeButton) activeButton.classList.add("active");
      sendControl(cmd);
      if (cmd !== "stop") {
        holdTimer = window.setInterval(() => sendControl(cmd), 260);
      }
    }

    function stopHold(sendStop = true) {
      if (holdTimer) {
        window.clearInterval(holdTimer);
        holdTimer = 0;
      }
      if (activeButton) {
        activeButton.classList.remove("active");
        activeButton = null;
      }
      if (sendStop && activeCmd !== "stop") {
        sendControl("stop");
      }
    }

    function renderStatus(data) {
      if (!data) return;
      document.querySelector("#cmdState").textContent = data.cmd || "stop";
      document.querySelector("#leftState").textContent = `${data.left ?? 0}%`;
      document.querySelector("#rightState").textContent = `${data.right ?? 0}%`;
      document.querySelector("#distanceState").textContent =
        data.distance_cm > 0 ? `${data.distance_cm} cm` : "--";

      const cameraDot = document.querySelector("#cameraDot");
      const cameraState = document.querySelector("#cameraState");
      const cameraOk = data.camera !== false;
      cameraDot.classList.toggle("warn", !cameraOk);
      cameraState.textContent = cameraOk ? "Camera" : "No Camera";

      const blockDot = document.querySelector("#blockDot");
      const blockState = document.querySelector("#blockState");
      blockDot.classList.toggle("warn", !!data.blocked);
      blockState.textContent = data.blocked ? "Blocked" : "Clear";

      if (data.network) {
        const wifiDot = document.querySelector("#wifiDot");
        const wifiState = document.querySelector("#wifiState");
        const stations = data.network.station_count ?? 0;
        wifiDot.classList.toggle("warn", data.network.transport !== "wifi");
        wifiState.textContent = `${data.network.mode || "ap"} ${data.network.ssid || ""}`;
        document.querySelector("#stationState").textContent =
          `${stations}/${data.network.max_station_count ?? "--"}`;
      }

      if ("audio_ready" in data || "audio_client" in data) {
        const audioDot = document.querySelector("#audioDot");
        const audioState = document.querySelector("#audioState");
        audioDot.classList.toggle("warn", !data.audio_ready || !data.audio_client);
        audioState.textContent = data.audio_client ? "Audio Live" : (data.audio_ready ? "Audio Ready" : "No Audio");
      }

      if (data.control_client) {
        document.querySelector("#clientState").textContent =
          `${data.control_source || "api"}:${data.control_client}`;
      } else if (data.client) {
        document.querySelector("#clientState").textContent =
          `${data.source || "api"}:${data.client}`;
      }
      if (data.heartbeat_age_ms > 0) {
        document.querySelector("#heartbeatState").textContent = `${data.heartbeat_age_ms} ms`;
      }
      if (Number.isFinite(data.uptime_s)) {
        document.querySelector("#uptimeState").textContent = formatUptime(data.uptime_s);
      }
      setLinkState("Link", true);
    }

    function formatUptime(seconds) {
      if (!Number.isFinite(seconds)) return "--";
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if (h > 0) return `${h}h ${m}m`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    }

    commandButtons.forEach((button) => {
      const cmd = button.dataset.cmd;
      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        startHold(cmd, button);
      });
      button.addEventListener("pointerup", () => {
        if (cmd === "stop") sendControl("stop");
        else stopHold(true);
      });
      button.addEventListener("pointercancel", () => stopHold(true));
      button.addEventListener("pointerleave", () => {
        if (activeButton === button) stopHold(true);
      });
    });

    speed.addEventListener("input", () => {
      speedValue.textContent = `${speed.value}%`;
      if (activeCmd !== "stop") sendControl(activeCmd);
    });

    speedButtons.forEach((button) => {
      button.addEventListener("click", () => setSpeedValue(Number(button.dataset.speed)));
    });

    if (!SpeechRecognition) {
      voiceButton.disabled = true;
      setVoiceState("浏览器不支持");
    } else {
      voiceButton.addEventListener("pointerdown", startVoice);
      voiceButton.addEventListener("pointerup", stopVoice);
      voiceButton.addEventListener("pointercancel", stopVoice);
      voiceButton.addEventListener("contextmenu", (event) => event.preventDefault());
    }

    if (!window.WebSocket || !(window.AudioContext || window.webkitAudioContext)) {
      listenButton.disabled = true;
      talkButton.disabled = true;
      setIntercomState("浏览器不支持");
    } else {
      listenButton.addEventListener("click", async () => {
        if (audioSocket?.readyState === WebSocket.OPEN || audioSocket?.readyState === WebSocket.CONNECTING) {
          disconnectIntercom();
          return;
        }
        try {
          await connectIntercom();
        } catch (error) {
          setIntercomState("连接失败");
        }
      });

      talkButton.addEventListener("click", () => {
        if (talkEnabled) stopTalk();
        else startTalk();
      });
    }

    document.addEventListener("keydown", (event) => {
      if (event.repeat) return;
      const cmd = keyMap.get(event.key);
      if (!cmd) return;
      event.preventDefault();
      startHold(cmd);
    });

    document.addEventListener("keyup", (event) => {
      if (!keyMap.has(event.key)) return;
      event.preventDefault();
      stopHold(true);
    });

    window.addEventListener("blur", () => {
      stopHold(true);
      stopVoice();
      stopTalk();
    });

    async function pollStatus() {
      try {
        const response = await fetch("/status", { cache: "no-store" });
        renderStatus(await response.json());
      } catch (error) {
        document.querySelector("#cmdState").textContent = "offline";
        setLinkState("Offline", false);
      }
    }

    async function sendHeartbeat() {
      try {
        const response = await fetch(`/heartbeat?seq=${nextSeq()}&source=web&client=${encodeURIComponent(clientId)}`, {
          cache: "no-store"
        });
        await response.json();
        setLinkState("Link", true);
      } catch (error) {
        setLinkState("Offline", false);
      }
    }

    setSpeedValue(Number(speed.value));
    sendControl("stop");
    sendHeartbeat();
    window.setInterval(pollStatus, 1000);
    window.setInterval(sendHeartbeat, 1000);
  </script>
</body>
</html>
