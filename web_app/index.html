<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote Car Web Controller</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <section class="stage">
      <header class="topbar">
        <div class="brand">
          <h1>Remote Car</h1>
          <div class="meta">
            <span class="pill"><i id="linkDot" class="dot"></i><span id="linkState">Disconnected</span></span>
            <span class="pill"><span id="motionState">stop</span></span>
            <span class="pill"><span id="distanceState">-- cm</span></span>
          </div>
        </div>
        <div class="endpoint">
          <label for="baseUrl">Car URL</label>
          <div class="endpoint-row">
            <input id="baseUrl" type="text" value="http://192.168.4.1" spellcheck="false">
            <button id="applyUrl" type="button">Apply</button>
          </div>
        </div>
      </header>

      <section class="preview">
        <img id="stream" class="stream" alt="car stream" src="/stream">
        <div id="previewFallback" class="fallback hidden">Preview unavailable</div>
      </section>
    </section>

    <aside class="panel">
      <section class="block">
        <h2>Drive</h2>
        <div class="dpad">
          <span></span>
          <button class="pad up" data-drive="forward" aria-label="Forward">^</button>
          <span></span>
          <button class="pad left" data-drive="left" aria-label="Left">&lt;</button>
          <button id="stopDrive" class="pad stop" type="button">Stop</button>
          <button class="pad right" data-drive="right" aria-label="Right">&gt;</button>
          <span></span>
          <button class="pad down" data-drive="backward" aria-label="Back">v</button>
          <span></span>
        </div>

        <div class="speed">
          <label for="speed">Speed <span id="speedValue">55</span>%</label>
          <input id="speed" type="range" min="0" max="100" value="55">
        </div>

        <div class="row">
          <button id="refreshNow" type="button">Refresh</button>
          <button id="liveNow" type="button">Live</button>
          <button id="snapshotNow" type="button">Snapshot</button>
        </div>
      </section>

      <section class="block">
        <h2>Gimbal</h2>
        <div class="dpad">
          <span></span>
          <button class="pad up" data-gimbal="tilt-up" aria-label="Tilt up">^</button>
          <span></span>
          <button class="pad left" data-gimbal="pan-left" aria-label="Pan left">&lt;</button>
          <button id="centerGimbal" class="pad stop" type="button">Center</button>
          <button class="pad right" data-gimbal="pan-right" aria-label="Pan right">&gt;</button>
          <span></span>
          <button class="pad down" data-gimbal="tilt-down" aria-label="Tilt down">v</button>
          <span></span>
        </div>
      </section>

      <section class="block">
        <h2>Status</h2>
        <div id="statusList" class="status-list"></div>
      </section>
    </aside>
  </main>

  <script src="./app.js"></script>
</body>
</html>
